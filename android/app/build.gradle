plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixpractice.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.mixpractice.studio"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DJUCE_BUILD_CONFIGURATION=Release",
                          "-DJUCE_WEB_BROWSER=0",
                          "-DJUCE_USE_CURL=0"
                targets "MixPracticeStudio"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += [
            "../../external/JUCE/modules/juce_core/native/javacore/init",
            "../../external/JUCE/modules/juce_core/native/javacore/app",
            "../../external/JUCE/modules/juce_gui_basics/native/javaopt/app"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
