name: Build Multiplatform (Windows EXE, macOS DMG, Android APK, iOS IPA)

on:
  push:
    branches: [ main, master, 'codex/**', '!codex/ios-track-import-fix' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Build Windows (.exe)
  # =========================================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JUCE Framework
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "external/JUCE/CMakeLists.txt")) {
            git clone --depth 1 https://github.com/juce-framework/JUCE.git external/JUCE
          }

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake for Windows
        run: cmake -B build-win -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows Standalone App
        run: cmake --build build-win --config Release --target MixPracticeStudio

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          $exe = Get-ChildItem -Path build-win -Filter "*Mix Practice Studio*.exe" -Recurse | Select-Object -First 1
          if ($null -ne $exe) {
            Write-Host "Found target app: $($exe.FullName)"
            Copy-Item -Path $exe.FullName -Destination dist-windows/
          } else {
            Write-Error "Could not find Mix Practice Studio.exe"
            exit 1
          }
          Compress-Archive -Path dist-windows/* -DestinationPath MixPracticeStudio-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixPracticeStudio-Windows-x64
          path: MixPracticeStudio-Windows-x64.zip

  # =========================================================================
  # 2. Build macOS (.app / .zip)
  # =========================================================================
  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JUCE Framework
        run: |
          if [ ! -d "external/JUCE" ] || [ ! -f "external/JUCE/CMakeLists.txt" ]; then
            git clone --depth 1 https://github.com/juce-framework/JUCE.git external/JUCE
          fi

      - name: Configure CMake
        run: cmake -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS App
        run: cmake --build build-mac --config Release --target MixPracticeStudio

      - name: Package macOS App
        run: |
          APP_PATH=$(find build-mac -name "*.app" -maxdepth 4 | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Packaging $APP_PATH"
            ditto -c -k --keepParent "$APP_PATH" MixPracticeStudio-macOS.zip
          else
            echo "App not found"
            exit 1
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixPracticeStudio-macOS
          path: MixPracticeStudio-macOS.zip

  # =========================================================================
  # 3. Build Android (.apk)
  # =========================================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install Linux build dependencies for JUCE tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Setup JUCE Framework
        run: |
          if [ ! -d "external/JUCE" ] || [ ! -f "external/JUCE/CMakeLists.txt" ]; then
            git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git external/JUCE
          fi
          python3 - <<'PY'
          from pathlib import Path

          juce_file = Path("external/JUCE/modules/juce_audio_devices/native/juce_Midi_android.cpp")
          with juce_file.open("r", newline="") as source_file:
              source = source_file.read()
          replacements = {
              "std::shared_ptr result = VirtualEndpointImplNative::make":
                  "std::shared_ptr<VirtualEndpointImplNative> result = VirtualEndpointImplNative::make",
              "std::shared_ptr result = LegacyVirtualPortImplNative::make":
                  "std::shared_ptr<LegacyVirtualPortImplNative> result = LegacyVirtualPortImplNative::make",
              "std::shared_ptr port = VirtualPortConnection::make":
                  "std::shared_ptr<VirtualPortConnection> port = VirtualPortConnection::make",
          }
          for old, new in replacements.items():
              if source.count(old) != (2 if "LegacyVirtualPortImplNative" in old else 1):
                  raise SystemExit(f"Unexpected JUCE Android MIDI source: {old}")
              source = source.replace(old, new)
          with juce_file.open("w", newline="") as juce_file_out:
              juce_file_out.write(source)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixPracticeStudio-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # =========================================================================
  # 4. Build iOS (.ipa)
  # =========================================================================
  build-ios:
    name: Build iOS (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JUCE Framework
        run: |
          if [ ! -d "external/JUCE" ] || [ ! -f "external/JUCE/CMakeLists.txt" ]; then
            git clone --depth 1 https://github.com/juce-framework/JUCE.git external/JUCE
          fi

      - name: Configure CMake for iOS
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=""

      - name: Build iOS App with Xcode
        run: |
          cmake --build build-ios --config Release --target MixPracticeStudio -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          APP_PATH=$(find build-ios -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build-ios -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MixPracticeStudio-iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixPracticeStudio-iOS-IPA
          path: MixPracticeStudio-iOS.ipa
