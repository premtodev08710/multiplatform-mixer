plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixpractice.studio'
    compileSdk 34
    // Match the NDK installed by nttld/setup-ndk in the Android workflow.
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.mixpractice.studio"
        // JUCE 8.0.15 uses Android's AFontMatcher API (introduced in API 29).
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DJUCE_BUILD_CONFIGURATION=Release",
                          "-DJUCE_WEB_BROWSER=0",
                          "-DJUCE_USE_CURL=0"
                targets "MixPracticeStudio"
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += [
            "src/main/java",
            "../../external/JUCE/modules/juce_core/native/javacore/init",
            "../../external/JUCE/modules/juce_core/native/javacore/app",
            "../../external/JUCE/modules/juce_core/native/java/app",
            "../../external/JUCE/modules/juce_gui_basics/native/java/app",
            "../../external/JUCE/modules/juce_gui_basics/native/javaopt/app"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
}
