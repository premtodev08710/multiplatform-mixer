plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixpractice.studio'
    compileSdk 34
    // Match the NDK installed by nttld/setup-ndk in the Android workflow.
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.mixpractice.studio"
        // JUCE 8.0.15 uses Android's AFontMatcher API (introduced in API 29).
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.0.2"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3 -fno-math-errno"
                arguments "-DJUCE_BUILD_CONFIGURATION=Release",
                          "-DJUCE_WEB_BROWSER=0",
                          "-DJUCE_USE_CURL=0"
                targets "MixPracticeStudio"
            }
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: "../keystore/release.keystore"
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "mixpractice123"
            def keyAliasVal = System.getenv("ANDROID_KEY_ALIAS") ?: "mixpractice"
            def keyPassVal = System.getenv("ANDROID_KEY_PASSWORD") ?: "mixpractice123"

            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasVal
            keyPassword keyPassVal
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += [
            "src/main/java",
            "../../external/JUCE/modules/juce_core/native/javacore/init",
            "../../external/JUCE/modules/juce_core/native/javacore/app",
            "../../external/JUCE/modules/juce_gui_basics/native/javaopt/app"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
            pickFirsts += ['**/*.version', '**/*.properties', '**/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
    implementation 'com.android.billingclient:billing:7.1.1'
}
