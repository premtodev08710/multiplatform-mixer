plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mixpractice.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.mixpractice.studio"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DJUCE_BUILD_CONFIGURATION=Release",
                          "-DJUCE_WEB_BROWSER=0",
                          "-DJUCE_USE_CURL=0"
                if (project.hasProperty("JUCE_TOOL_PATH")) {
                    arguments "-DJUCE_TOOL_PATH=" + project.property("JUCE_TOOL_PATH")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
