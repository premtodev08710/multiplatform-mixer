name: Build iOS import fix

on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-track-import-fix', 'main']

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JUCE
        run: git clone --depth 1 --branch 8.0.15 https://github.com/juce-framework/JUCE.git external/JUCE
      - name: Configure iPhone and iPad app
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
      - name: Build app
        run: cmake --build build-ios --config Release --target MixPracticeStudio -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      - name: Package IPA for sideloading
        shell: python
        run: |
          import pathlib, plistlib, shutil, subprocess
          apps = [a for a in pathlib.Path('build-ios').glob('**/*.app') if a.is_dir()]
          print('Found apps:', apps)
          candidates = [a for a in apps if 'Release' in str(a) or 'iphoneos' in str(a)]
          if not candidates:
              candidates = apps
          if not candidates:
              raise SystemExit('No .app found in build-ios')
          app = candidates[0]
          print(f'Using app: {app}')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          print('App version:', info.get('CFBundleShortVersionString'))
          print('UIFileSharingEnabled:', info.get('UIFileSharingEnabled'))
          payload = pathlib.Path('Payload')
          payload.mkdir(exist_ok=True)
          shutil.copytree(app, payload / app.name, dirs_exist_ok=True)
          subprocess.run(['zip', '-qry', 'MixPracticeStudio.ipa', 'Payload'], check=True)
          subprocess.run(['zip', '-q', 'MixPracticeStudio-iOS-IPA.zip', 'MixPracticeStudio.ipa'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: MixPracticeStudio-iOS-1.0.2
          path: |
            MixPracticeStudio.ipa
            MixPracticeStudio-iOS-IPA.zip
          if-no-files-found: error
      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.1 MixPracticeStudio.ipa MixPracticeStudio-iOS-IPA.zip --clobber || true
