<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mix Practice Studio Lite</title>
  <meta name="description" content="Mix Practice Studio Lite — Multitrack Mixing Console Simulator (16 Tracks / 4 FX)" />
  <link rel="icon" type="image/png" href="/assets/app_icon.png" />
  <link rel="apple-touch-icon" href="/assets/app_icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS Safari Standalone PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mix Practice" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#121417" />

  <!-- Fonts for Console & Lexicon VFD Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/lite.css?v=9" />
</head>
<body>
  <!-- Fixed Full-Viewport Wrapper (No Page Scroll Ever) -->
  <div id="mps-root">
    <!-- Auto-Scaled Console Stage matching JUCE MainComponent (1100x520 logical space) -->
    <div id="mps-stage">

      <!-- 1. TOP NAVIGATION BAR (Matches MainComponent.cpp navButtons[0..9]) -->
      <header id="topNavBar" class="mps-top-nav">
        <div id="navTabsContainer" class="mps-nav-tabs"></div>
        <button id="topSectionSlicerBtn" class="cbtn" onclick="MPS.openSectionSlicerModal(false)" style="height:32px;padding:0 10px;font-size:11px;font-weight:700;background:#003847;border:1px solid #00d2ff;color:#00e5ff;white-space:nowrap;display:flex;align-items:center;gap:4px;border-radius:4px;cursor:pointer;flex-shrink:0;" title="คลิกเพื่อเลือกท่อนเพลง 0-25%, 25-50%, 50-75%, 75-100% หรือทั้งเพลง">
          <span>✂️</span> <span>ท่อน: <b>0-25%</b></span> <span style="font-size:9px;opacity:0.8;">▼</span>
        </button>
      </header>

      <!-- Top-Right Docked Settings Gear Button (Matches MainComponent::SettingsButton) -->
      <button id="settingsGearBtn" class="mps-gear-btn" title="Settings & Navigation Menu" aria-label="Settings">
        <svg viewBox="0 0 34 34" width="100%" height="100%">
          <circle cx="17" cy="17" r="15" class="gear-bg" />
          <path id="gearPath" fill="#cfd8dc" fill-rule="evenodd" d="M15.6,5.2 L18.4,5.2 L19.1,8.1 L21.2,9.0 L23.8,7.4 L25.8,9.4 L24.2,12.0 L25.1,14.1 L28.0,14.8 L28.0,17.6 L25.1,18.3 L24.2,20.4 L25.8,23.0 L23.8,25.0 L21.2,23.4 L19.1,24.3 L18.4,27.2 L15.6,27.2 L14.9,24.3 L12.8,23.4 L10.2,25.0 L8.2,23.0 L9.8,20.4 L8.9,18.3 L6.0,17.6 L6.0,14.8 L8.9,14.1 L9.8,12.0 L8.2,9.4 L10.2,7.4 L12.8,9.0 L14.9,8.1 Z M17,12.8 A4.2,4.2 0 1,0 17,21.2 A4.2,4.2 0 1,0 17,12.8 Z" />
        </svg>
      </button>

      <!-- 2. CENTER ACTIVE SCREEN AREA -->
      <main id="screenArea" class="mps-screen-area">
        <!-- Screen 0: HOME (Mixer Console) -->
        <section id="screen-home" class="mps-screen active"></section>

        <!-- Screen 1: DETAIL (Channel Strip Inspector: Config/Preamp, Gate, Dyn, EQ, Sends, Naming, Preset) -->
        <section id="screen-detail" class="mps-screen"></section>

        <!-- Screen 2: TRACKS (Multitrack Player & File Manager - Max 16 Tracks) -->
        <section id="screen-tracks" class="mps-screen"></section>

        <!-- Screen 3: EFFECTS (X32 Virtual FX Rack - 4 Slots Lite) -->
        <section id="screen-effects" class="mps-screen"></section>

        <!-- Screen 4: SCENES (Project Storage & Console Scene Snapshots) -->
        <section id="screen-scenes" class="mps-screen"></section>

        <!-- Screen 5..8: Phase 4 Roadmap Placeholder -->
        <section id="screen-placeholder" class="mps-screen"></section>

        <!-- Screen 9: SETUP (Audio Hardware & Output Setup + iOS PWA Guide) -->
        <section id="screen-setup" class="mps-screen"></section>
      </main>

      <!-- 3. BOTTOM TRANSPORT BAR (Matches TransportBar.cpp + TimelineRangeComponent.cpp) -->
      <footer id="transportBar" class="mps-transport-bar">
        <!-- Row 1: Interactive Song Timeline & Range Selector -->
        <div id="mainTimelineWrap" class="mps-timeline-wrap">
          <canvas id="mainTimelineCanvas" class="mps-timeline-canvas"></canvas>
          <div class="mps-timeline-zoom-btns">
            <button class="tl-zoom-btn" onclick="MPS.zoomTimeline(1/1.5)" title="Zoom Out (ขยายเวลาออก)">−</button>
            <button class="tl-zoom-btn" onclick="MPS.zoomTimeline(1.5)" title="Zoom In (ซูมเข้าเวลา)">+</button>
            <button class="tl-zoom-btn tl-fit" onclick="MPS.resetTimelineZoom()" title="Fit 1x (แสดงทั้งเพลง)">1x</button>
            <button class="tl-zoom-btn tl-ab" onclick="MPS.zoomToLoop()" title="Zoom to Loop A-B (ซูมเข้าลูป)">🔍 A-B</button>
          </div>
        </div>

        <!-- Row 2: Transport Buttons, Range Controls & Readouts -->
        <div class="mps-transport-row2">
          <div class="mps-transport-btns">
            <button id="btnTransPlay" class="mps-tbtn tbtn-play" onclick="MPS.play()">PLAY</button>
            <button id="btnTransPause" class="mps-tbtn tbtn-pause" onclick="MPS.pause()">PAUSE</button>
            <button id="btnTransStop" class="mps-tbtn tbtn-stop" onclick="MPS.stop()">STOP</button>
            <button id="btnTransLoop" class="mps-tbtn tbtn-loop active" onclick="MPS.toggleLoop()">LOOP</button>
            <button class="mps-tbtn tbtn-sec" onclick="MPS.setMarkerA()" title="Set Section Start [ A ]">[ A ]</button>
            <button class="mps-tbtn tbtn-sec" onclick="MPS.setMarkerB()" title="Set Section End [ B ]">[ B ]</button>
            <button class="mps-tbtn tbtn-sec" onclick="MPS.setRangeAll()" title="Select Entire Song Range">ALL</button>
            <button id="btnSectionMenu" class="mps-tbtn tbtn-sec-menu" onclick="MPS.openSectionSlicerModal(false)" style="background:#003847;border:1px solid #00d2ff;color:#00e5ff;font-weight:700;" title="เลือกท่อนเพลง 0-25%, 25-50%, 50-75%, 75-100% หรือทั้งเพลง">✂️ ท่อนเพลง ▼</button>
            <button class="mps-tbtn tbtn-demo" onclick="MPS.loadDemoStems()" title="โหลดเสียงมัลติแทร็กตัวอย่างเพื่อฝึกมิกซ์ทันที">🎵 DEMO</button>
          </div>

          <div class="mps-transport-readouts">
            <span id="lblTransTime" class="tr-time">00:00.00 / 00:00.00</span>
            <span id="lblTransRange" class="tr-range">No Tracks Loaded</span>
            <span id="lblTransStatus" class="tr-status">Out: WebAudio  Buf: 100%</span>
            <span id="lblTransCpu" class="tr-cpu">CPU: 2%</span>
          </div>
        </div>
      </footer>

      <!-- Popup Menu Overlay Container -->
      <div id="mpsPopupOverlay" class="mps-popup-overlay" style="display:none;"></div>

      <!-- Modal Dialog Container (Terms / Alerts / FX Library Carousel) -->
      <div id="mpsModalOverlay" class="mps-modal-overlay" style="display:none;"></div>

    </div>

    <!-- Orientation Prompt Overlay for Mobile in Portrait (Tells user to turn phone sideways) -->
    <div id="mpsOrientationOverlay" class="mps-rotate-prompt" style="display:none;">
      <div class="rotate-card">
        <div class="rotate-icon-anim">📱 ➔ 📲 🔄</div>
        <div class="rotate-title">โปรดหมุนโทรศัพท์เป็นแนวนอน</div>
        <div class="rotate-subtitle">Mix Practice Studio ออกแบบสำหรับใช้งานแนวนอน (Landscape Mixing Console) เหมือนกับบน Android เพื่อให้ควบคุม 8 แชนเนลและมาสเตอร์ได้อย่างสมบูรณ์แบบ</div>
        <button class="rotate-force-btn" onclick="MPS.forcePortraitPreview()">หรือดูในมุมมองแนวตั้ง</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Inputs for Importing Audio & Scenes -->
  <input type="file" id="hiddenAudioInput" multiple accept="audio/*,.wav,.mp3,.flac,.aif,.aiff,.m4a,.aac,.ogg" style="display:none;" />
  <input type="file" id="hiddenSceneInput" accept=".mpsproj,.zip,.json,.scn,.txt,application/zip,application/json,application/octet-stream,*/*" style="display:none;" />

  <script src="/lite.js?v=18"></script>
</body>
</html>
